<style>
  .nf {
    min-height: 100vh;
    display: grid; place-items: center;
    text-align: center;
    position: relative; overflow: hidden;
  }
  .nf-code {
    font-family: var(--font-mono);
    font-size: clamp(5rem, 22vw, 11rem);
    font-weight: 500; line-height: 1;
    letter-spacing: -.06em;
    background: linear-gradient(100deg, var(--accent), var(--accent-2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .nf h1 { font-size: clamp(1.4rem, 4vw, 2.1rem); font-weight: 700; margin: .75rem 0 .75rem; }
  .nf p { color: var(--text-muted); max-width: 42ch; margin: 0 auto 2rem; }
  .nf-actions { display: flex; gap: .7rem; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="nf">
  <div class="hero-bg" aria-hidden="true">
    <div class="hero-grid"></div>
    <div class="orb orb-a"></div>
  </div>
  <div class="wrap" style="position:relative">
    <p class="nf-code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The link may be broken, or the page may have moved. Everything lives on one page anyway.</p>
    <div class="nf-actions">
      <a class="btn btn-primary" href="/MyPortfolio/">Back to the site<span class="btn-arrow" aria-hidden="true">→</span></a>
      <a class="btn" href="mailto:shaidenpillay15@gmail.com">Email me</a>
    </div>
  </div>
</main>
<script>
  /* keep the 404 in the visitor's chosen theme */
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    document.documentElement.setAttribute(
      'data-theme',
      t || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    );
  })();
</script>
</body>
